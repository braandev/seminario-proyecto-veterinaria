<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesion - CRM Veterinaria Rincon</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body class="landing login-body">

<a href="index.html" class="login-back-btn" aria-label="Volver al sitio">←</a>

<div class="login-wrap">
  <a href="index.html" class="login-brand">
    <div class="brand-icon">🐾</div>
    Veterinaria Rincon
  </a>

  <div class="login-card">
    <span class="login-eyebrow">Panel CRM</span>
    <h1>Iniciar Sesion</h1>
    <p class="login-subtitle">Ingresa tus credenciales para acceder al panel de gestion.</p>

    <form class="login-form" id="login-form" autocomplete="on">
      <label class="login-field">
        <span>Usuario o email</span>
        <input type="email" name="email" placeholder="nombre@veterinariarincon.com" required>
      </label>
      <label class="login-field">
        <span>Contraseña</span>
        <input type="password" name="password" placeholder="••••••••" required>
      </label>

      <div class="login-row">
        <label class="login-remember">
          <input type="checkbox" name="remember">
          Recordarme
        </label>
        <a href="#" class="login-forgot">Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-hero-primary login-submit">Ingresar al CRM</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'crm.html';
  });
</script>

</body>
</html>
